modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
bannerFile = "assets/icon.png"
iconFile = "assets/icon.png"
iconBlur = false
authors = "${mod_author}"
description = '''${description}'''
displayURL = "${sources}"
modUrl = "${homepage}"
updateJSONURL = "https://raw.githubusercontent.com/0Templ/ModVersions/refs/heads/main/neoforge/surface-particles/v1/${update_json_version}.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
