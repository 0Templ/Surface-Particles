modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/icon.png"
logoBlur = false
authors = "${mod_author}"
description = '''${description}'''
displayURL = "${homepage}"
updateJSONURL = "https://raw.githubusercontent.com/0Templ/ModVersions/refs/heads/main/forge/surface-particles/v1/${update_json_version}.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.forge.mixins.json"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
