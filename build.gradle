    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply false
    id 'com.gradleup.shadow' version '8.3.10' apply(false)

    id "me.modmuss50.mod-publish-plugin" version "2.0.0-beta.2" apply false
}

allprojects {
    repositories {
        maven {
            url = "https://modmaven.dev"
        }
        maven {
            url "https://maven.shedaniel.me"
        }
