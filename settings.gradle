pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

def projectName = providers.gradleProperty("project_name").orNull
if (projectName == null) {
    def modId = providers.gradleProperty("mod_id").orElse("mod").get()
    def mc = providers.gradleProperty("minecraft_version").orElse("0.0.0").get()
    projectName = "${modId}-${mc}"
}

rootProject.name = projectName

include("common", "fabric", "forge")
